- title: Profile
  type: list
  contents:
    - "PhD student at Bar-Ilan University, advised by Liam Roditty, working on algorithms for distance-related graph problems: distance oracles, girth and shortest cycle approximation, compact routing, and diameter. Began the BSc during high school and published at SODA during the MSc. Former IDF officer with five years in Unit 8200 as an R&D engineer, a recruiter for its elite tracks, and the founding lead of a new cyber R&D team; discharged in 2024 and now researching full-time."

